<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pr1v · public chain. pr1v you.</title>
<meta name="description" content="The privacy layer for Solana. Rate any wallet's opsec, trace its funding, check if two wallets are linked, and send encrypted notes wallet to wallet.">
<meta property="og:title" content="pr1v · public chain. pr1v you.">
<meta property="og:description" content="Rate any wallet's opsec. Trace its funding. Message any wallet, sealed.">
<meta property="og:image" content="https://pr1v.vercel.app/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://pr1v.vercel.app/og.png">
<meta name="theme-color" content="#ececee">
<link rel="icon" href="/favicon.png">
<link rel="preload" href="/assets/fonts/jbmono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/pr1v.css?v=2">
</head>
<body>
<canvas id="intro" aria-hidden="true"></canvas>
<div id="fade" aria-hidden="true"></div>
<button id="skip" aria-label="skip the intro"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 5l8 7-8 7zM13 5l8 7-8 7z" fill="currentColor"/></svg></button>

<div id="os">
  <header class="bar">
    <div class="bl">
      <button class="brand" data-run="help" aria-label="pr1v home"><img src="/icon.png" alt=""><b>pr1v</b></button>
      <nav class="menu" id="menu">
        <button data-fill="opsec ">opsec</button>
        <button data-fill="trace ">trace</button>
        <button data-fill="link ">link</button>
        <button data-run="trenches">trenches</button>
        <button data-fill="dev ">dev</button>
        <button data-run="whoami">whoami</button>
        <button data-run="drop">drop</button>
        <button data-run="leaks">leaks</button>
        <button data-run="coin">coin</button>
        <button data-run="about">about</button>
        <button data-run="help">help</button>
      </nav>
    </div>
    <div class="br">
      <span class="tz" id="tz" title="what your browser clock tells every site"></span>
      <button class="ic" id="theme" aria-label="switch theme"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg></button>
      <button class="wal" id="wallet">connect</button>
      <button class="ic menu-btn" id="menuBtn" aria-label="open the menu"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
  </header>

  <main class="desk">
    <section class="win term" id="term">
      <div class="tbar tabs"><button class="tab on" data-tab="term"><span class="sq"></span><span id="ttl">pr1v — anon — 160×24</span></button><button class="tab" data-tab="trench"><i class="live"></i>trenches<b id="trN"></b></button><span class="ctl"><i>–</i><i>□</i><i>×</i></span></div>
      <div class="pane" id="paneTerm">
        <div class="out" id="out" role="log" aria-live="polite"></div>
        <form class="prompt" id="cmd" autocomplete="off">
          <label for="in" class="ps"><span class="u">anon@laptop</span> ~ %</label>
          <input id="in" name="in" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go" aria-label="type a command">
          <button type="submit" class="go" aria-label="run">↵</button>
        </form>
        <div class="chips" id="chips">
          <button data-fill="opsec ">opsec &lt;wallet&gt;</button>
          <button data-run="opsec me">opsec me</button>
          <button data-run="trenches">trenches</button>
          <button data-fill="dev ">dev &lt;coin&gt;</button>
          <button data-fill="trace ">trace &lt;wallet&gt;</button>
          <button data-fill="link ">link &lt;a&gt; &lt;b&gt;</button>
          <button data-run="whoami">whoami</button>
          <button data-run="drop inbox">drop inbox</button>
          <button data-run="leaks">leaks</button>
          <button data-run="help">help</button>
          <button data-run="clear">clear</button>
        </div>
      </div>
      <div class="pane trench" id="paneTrench" hidden>
        <div class="th">
          <div class="seg" id="trTabs"><button class="on" data-t="new">new</button><button data-t="hot">hot 5m</button><button data-t="organic">organic 5m</button><button data-t="traded">most traded</button></div>
          <input id="trQ" placeholder="filter name, ticker or dev" spellcheck="false" autocomplete="off">
          <label class="tg"><input type="checkbox" id="trSerial"><span>hide serial devs</span></label>
          <button class="pz" id="trPause" aria-pressed="false">pause</button>
        </div>
        <div class="tstat" id="trStat"></div>
        <div class="thead"><span></span><span>coin</span><span>mcap</span><span>holders</span><span>5m flow</span><span>dev</span><span></span></div>
        <div class="tlist" id="trList"><p class="dim pad">reading pump.fun…</p></div>
      </div>
    </section>

    <aside class="side" id="side">
      <section class="win w">
        <div class="tbar"><span class="sq"></span><span class="ttl">opsec.app</span></div>
        <form class="wb scan" id="scanF">
          <p class="lbl">how doxxed is a wallet?</p>
          <div class="row"><input id="scanI" placeholder="paste any Solana wallet" spellcheck="false" autocomplete="off"><button>scan</button></div>
          <div class="row2"><button type="button" data-run="opsec me">scan mine</button><button type="button" data-fill="link ">link two</button><button type="button" data-fill="trace ">trace</button></div>
        </form>
      </section>
      <section class="win w">
        <div class="tbar"><span class="sq"></span><span class="ttl">trenches · live</span><i class="live"></i></div>
        <div class="wb" id="pulse"><p class="dim">reading pump.fun…</p></div>
      </section>
      <section class="win w">
        <div class="tbar"><span class="sq"></span><span class="ttl">this browser</span></div>
        <div class="wb" id="fp"></div>
      </section>
      <section class="win w">
        <div class="tbar"><span class="sq"></span><span class="ttl">drop · sealed notes</span></div>
        <div class="wb" id="dropW"><p class="dim">reading the chain…</p></div>
      </section>
      <section class="win w" id="coinW" hidden>
        <div class="tbar"><span class="sq"></span><span class="ttl">$PR1V</span></div>
        <div class="wb" id="coinB"></div>
      </section>
      <section class="win w">
        <div class="tbar"><span class="sq"></span><span class="ttl">checklist</span></div>
        <div class="wb" id="todo"></div>
      </section>
    </aside>
  </main>
</div>
<div id="toast" role="status"></div>
<script src="/assets/nacl.min.js" defer></script>
<script src="/assets/term.js?v=2" defer></script>
<script type="module" src="/assets/intro.js?v=2"></script>
</body>
</html>
